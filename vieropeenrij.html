<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vier op een Rij</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Gedeelde stijl van de spelletjessite: lucht met wolken, dikke inktranden, gele titels.
   Bewust één vaste, vrolijke look (geen donkere variant). */
:root {
  --sky-top: #7cc8ef;
  --sky-bottom: #c4ebfb;
  --cloud: #ffffff;
  --paper: #ffffff;
  --ink: #1f2a3c;
  --muted: #55667f;
  --soft: #e9f4fb;
  --guide: #d3e2ee;
  --yellow: #ffcc2e;
  --yellow-deep: #f2a900;
  --yellow-soft: #fff3c4;
  --red: #e0443a;
  --red-soft: #fde2df;
  --blue: #2f6fe0;
  --blue-deep: #1d4fb8;
  --blue-soft: #dce8fb;
  --good: #1f9a5a;
  --good-soft: #d9f5e5;
  --bad: #e0443a;
  --bad-soft: #fde2df;
  --font-title: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--sky-top); }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%) fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 44px;
  position: relative;
  overflow-x: hidden;
}

.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.cloud { position: absolute; fill: var(--cloud); opacity: .9; animation: drift linear infinite; }
.cloud.c1 { width: 130px; top: 9%; left: -10%; animation-duration: 70s; }
.cloud.c2 { width: 90px; top: 38%; left: -20%; animation-duration: 95s; animation-delay: -40s; opacity: .7; }
.cloud.c3 { width: 160px; top: 70%; left: -25%; animation-duration: 120s; animation-delay: -75s; opacity: .6; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(130vw); } }

.wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.back {
  display: inline-flex; align-items: center; gap: 6px; width: fit-content;
  padding: 7px 14px 7px 10px; border-radius: 999px;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  color: var(--ink); text-decoration: none; font: 600 14px/1 var(--font-ui);
  transition: transform .08s, box-shadow .08s;
}
.back:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.back:focus-visible { outline: 4px solid var(--yellow-deep); outline-offset: 2px; }
.back svg { width: 16px; height: 16px; }

.logo {
  margin: 0;
  font: 400 clamp(44px, 12vw, 72px)/0.95 var(--font-title);
  letter-spacing: .03em;
  color: var(--yellow);
  -webkit-text-stroke: 6px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  transform: rotate(-2deg);
  text-wrap: balance;
}
.lede { margin: 0; color: var(--ink); opacity: .8; font-size: 15px; max-width: 44ch; }

.card {
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 7px 0 var(--ink);
  padding-block: 20px;
  padding-inline: clamp(14px, 4.5vw, 26px);
  display: flex; flex-direction: column; gap: 16px;
}

details.card:not([open]) { gap: 0; }

/* Spelerskaarten (2 spelers) */
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.player {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 16px; min-width: 0;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  transition: transform .2s, box-shadow .2s, background .2s;
}
.player.active { background: var(--yellow-soft); transform: translateY(-3px); box-shadow: 0 7px 0 var(--ink); }
.who { display: flex; flex-direction: column; min-width: 0; }
.player input {
  font: 600 17px/1.2 var(--font-ui); color: var(--ink); background: transparent;
  border: 0; border-bottom: 2px dashed transparent; padding: 1px 0; width: 100%; min-width: 0;
}
.player input:hover { border-bottom-color: var(--guide); }
.player input:focus { outline: none; border-bottom-color: var(--ink); }
.sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player.active .sub { color: var(--ink); font-weight: 600; }
.score { font: 400 30px/1 var(--font-title); font-variant-numeric: tabular-nums; }

.status {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 36px; text-align: center;
  font: 400 clamp(22px, 5.5vw, 28px)/1.1 var(--font-title); letter-spacing: .02em;
}
.status.flash { animation: bounce .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bounce { from { transform: translateY(-10px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }

.btn {
  font: 700 17px/1 var(--font-ui);
  padding: 13px 20px; border-radius: 14px;
  border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--yellow-deep); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.yellow { background: var(--yellow); }
.btn.small { font-size: 14px; padding: 9px 14px; box-shadow: 0 3px 0 var(--ink); }
.btn.danger.armed { background: var(--bad); color: #fff; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--ink); opacity: .75; font-size: 13px; margin: 0; max-width: 46ch; }

@media (prefers-reduced-motion: reduce) {
  .cloud, .status.flash { animation: none !important; }
  .player, .btn, .back { transition: none; }
}
</style>
<style>
/* Speelbord: blauw rek met inktrand, gaten met rand, schijven vallen achter het front langs */
.board {
  position: relative;
  background: var(--blue);
  border: 4px solid var(--ink);
  border-radius: 20px;
  padding: 3.2%;
  box-shadow: 0 7px 0 var(--ink), inset 0 -6px 0 var(--blue-deep);
}
.field { position: relative; aspect-ratio: 7 / 6; background: var(--soft); border-radius: 8px; overflow: hidden; }
.discs, .face, .rims, .cols {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr);
}
.face {
  background: var(--blue);
  -webkit-mask-image: radial-gradient(circle closest-side, transparent 0 78%, #000 80%);
          mask-image: radial-gradient(circle closest-side, transparent 0 78%, #000 80%);
  -webkit-mask-size: calc(100% / 7) calc(100% / 6); mask-size: calc(100% / 7) calc(100% / 6);
  -webkit-mask-repeat: repeat; mask-repeat: repeat;
  pointer-events: none;
}
.rims { pointer-events: none; }
.rims span { display: grid; place-items: center; }
.rims span::after { content: ""; width: 80%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--ink); }

.cell { display: grid; place-items: center; animation: drop var(--t, .4s) cubic-bezier(.5, 0, .9, .4) both; }
@keyframes drop {
  0% { transform: translateY(calc(-100% * (var(--r) + 1))); }
  72% { transform: translateY(0); animation-timing-function: ease-out; }
  86% { transform: translateY(-9%); animation-timing-function: ease-in; }
  100% { transform: translateY(0); }
}
.disc {
  width: 82%; aspect-ratio: 1; border-radius: 50%; position: relative;
  box-shadow: inset 0 0 0 5px rgba(0, 0, 0, .13), inset 0 -5px 0 rgba(0, 0, 0, .1);
}
.disc.p1 { background: var(--red); }
.disc.p2 { background: var(--yellow); }
.disc.winner::after {
  content: ""; position: absolute; inset: 30%; border-radius: 50%;
  background: #fff; border: 3px solid var(--ink);
  animation: glow .9s ease-in-out infinite alternate;
}
@keyframes glow { from { transform: scale(.7); } to { transform: scale(1.05); } }
.discs.done .disc:not(.winner) { filter: saturate(.5) brightness(.9); transition: filter .4s; }

.cols { grid-template-rows: 1fr; z-index: 2; }
.cols button { all: unset; cursor: pointer; height: 100%; border-radius: 8px; }
.cols button:focus-visible { box-shadow: inset 0 0 0 4px var(--yellow-deep); }
.cols button:disabled { cursor: default; }

.chip {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  border: 3px solid var(--ink); background: var(--pc);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .13);
}
.player[data-p="1"] { --pc: var(--red); }
.player[data-p="2"] { --pc: var(--yellow); }

.preview-row { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 calc(3.2% + 4px); margin-bottom: 6px; }
.ghost { aspect-ratio: 1; display: grid; place-items: center; }
.ghost span {
  width: 70%; aspect-ratio: 1; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--gc);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .13);
  opacity: 0; transform: translateY(8px);
  transition: opacity .15s, transform .15s;
}
.ghost.on span { opacity: 1; transform: none; animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-4px); } }
.preview-row[data-p="1"] { --gc: var(--red); }
.preview-row[data-p="2"] { --gc: var(--yellow); }
.colnums {
  display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 calc(3.2% + 4px); margin-top: 14px;
  font: 400 15px/1 var(--font-title); color: var(--muted); text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .cell, .disc.winner::after, .ghost.on span { animation: none !important; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <svg class="cloud c1" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
  <svg class="cloud c2" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
  <svg class="cloud c3" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
</div>
<div class="wrap">
  <a class="back" href="./"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle spelletjes</a>
  <header>
    <h1 class="logo">4 OP EEN RIJ</h1>
  </header>

  <section class="players" aria-label="Spelers en score">
    <div class="player" data-p="1">
      <span class="chip" aria-hidden="true"></span>
      <div class="who">
        <input id="name1" value="Speler 1" maxlength="16" aria-label="Naam speler 1 (rood)">
        <span class="sub" id="sub1">rood</span>
      </div>
      <span class="score" id="score1">0</span>
    </div>
    <div class="player" data-p="2">
      <span class="chip" aria-hidden="true"></span>
      <div class="who">
        <input id="name2" value="Speler 2" maxlength="16" aria-label="Naam speler 2 (geel)">
        <span class="sub" id="sub2">geel</span>
      </div>
      <span class="score" id="score2">0</span>
    </div>
  </section>

  <section class="card">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div>
      <div class="preview-row" id="preview" data-p="1" aria-hidden="true"></div>
      <div class="board">
        <div class="field">
          <div class="discs" id="discs"></div>
          <div class="face"></div>
          <div class="rims" id="rims" aria-hidden="true"></div>
          <div class="cols" id="cols"></div>
        </div>
      </div>
      <div class="colnums" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
    </div>
    <div class="controls">
      <button class="btn" id="undo" type="button">Zet terug</button>
      <button class="btn yellow" id="newgame" type="button">Nieuw spel</button>
    </div>
  </section>

  <div class="foot">
    <p class="hint">Om de beurt een schijf. Vier op een lijn wint: liggend, staand of schuin. Toetsenbord: 1 tot 7.</p>
    <button class="btn small danger" id="fullReset" type="button">Volledig resetten</button>
  </div>
</div>

<script>
(function () {
  const COLS = 7, ROWS = 6, KEY = 'vier-op-een-rij';
  const $ = (id) => document.getElementById(id);
  const discsEl = $('discs'), colsEl = $('cols'), previewEl = $('preview'), statusEl = $('status');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let grid, moves, current, over, winLine, starter = 1, busy = false, hoverCol = 3;
  let scores = { 1: 0, 2: 0 };

  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) {
      scores = s.scores || scores;
      if (s.names) { $('name1').value = s.names[1] || 'Speler 1'; $('name2').value = s.names[2] || 'Speler 2'; }
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ scores, names: { 1: $('name1').value, 2: $('name2').value } })); } catch (e) {}
  }
  const name = (p) => ($('name' + p).value.trim() || ('Speler ' + p));
  const chip = (p) => `<span class="chip" style="--pc:var(--${p === 1 ? 'red' : 'yellow'})" aria-hidden="true"></span>`;
  const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  for (let i = 0; i < COLS * ROWS; i++) $('rims').appendChild(document.createElement('span'));
  for (let c = 0; c < COLS; c++) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'col' + c;
    b.setAttribute('aria-label', 'Kolom ' + (c + 1));
    b.addEventListener('click', () => play(c));
    b.addEventListener('pointerenter', () => setHover(c));
    b.addEventListener('focus', () => setHover(c));
    colsEl.appendChild(b);
    const g = document.createElement('div');
    g.className = 'ghost'; g.innerHTML = '<span></span>';
    previewEl.appendChild(g);
  }
  colsEl.addEventListener('pointerleave', () => setHover(-1));

  function setHover(c) {
    hoverCol = c;
    [...previewEl.children].forEach((g, i) => g.classList.toggle('on', i === c && !over && grid[0][i] === 0));
  }

  function newGame(first) {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    moves = []; over = false; winLine = null; current = first;
    discsEl.innerHTML = ''; discsEl.classList.remove('done');
    update();
  }

  function lowestRow(c) { for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c] === 0) return r; return -1; }

  function play(c) {
    if (over || busy) return;
    const r = lowestRow(c);
    if (r < 0) return;
    grid[r][c] = current;
    moves.push({ r, c, p: current });

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.gridColumn = c + 1; cell.style.gridRow = r + 1;
    cell.style.setProperty('--r', r);
    const t = reduce ? 0 : 0.28 + r * 0.06;
    cell.style.setProperty('--t', t + 's');
    cell.dataset.key = r + '-' + c;
    cell.innerHTML = `<div class="disc p${current}"></div>`;
    discsEl.appendChild(cell);

    busy = true;
    setTimeout(() => { busy = false; }, t * 700);

    const line = findWin(r, c, current);
    if (line) { over = true; winLine = line; scores[current]++; setTimeout(markWin, t * 1000); }
    else if (moves.length === ROWS * COLS) { over = true; }
    else { current = current === 1 ? 2 : 1; }
    save();
    update(!!line || over);
  }

  function findWin(r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc] === p) { line.push([rr, cc]); rr += dr * s; cc += dc * s; }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  function markWin() {
    if (!winLine) return;
    discsEl.classList.add('done');
    winLine.forEach(([r, c]) => { const el = discsEl.querySelector(`[data-key="${r}-${c}"] .disc`); if (el) el.classList.add('winner'); });
  }

  function undo() {
    if (!moves.length || busy) return;
    const last = moves.pop();
    grid[last.r][last.c] = 0;
    const el = discsEl.querySelector(`[data-key="${last.r}-${last.c}"]`);
    if (el) el.remove();
    if (winLine) { scores[last.p]--; save(); }
    over = false; winLine = null;
    discsEl.classList.remove('done');
    discsEl.querySelectorAll('.winner').forEach((d) => d.classList.remove('winner'));
    current = last.p;
    update();
  }

  function update(flash) {
    $('score1').textContent = scores[1];
    $('score2').textContent = scores[2];
    [1, 2].forEach((p) => {
      const active = !over && p === current;
      document.querySelector(`.player[data-p="${p}"]`).classList.toggle('active', active);
      $('sub' + p).textContent = active ? 'is aan zet' : (p === 1 ? 'rood' : 'geel');
    });
    previewEl.dataset.p = current;

    statusEl.classList.remove('flash');
    if (over && winLine) statusEl.innerHTML = `${chip(current)}<span>${esc(name(current))} wint!</span>`;
    else if (over) statusEl.innerHTML = '<span>Gelijkspel, het bord is vol</span>';
    else statusEl.innerHTML = `${chip(current)}<span>${esc(name(current))} is aan zet</span>`;
    if (flash) { void statusEl.offsetWidth; statusEl.classList.add('flash'); }

    for (let c = 0; c < COLS; c++) $('col' + c).disabled = over || grid[0][c] !== 0;
    $('undo').disabled = moves.length === 0;
    setHover(hoverCol);
  }

  $('newgame').addEventListener('click', () => { starter = starter === 1 ? 2 : 1; newGame(starter); });
  $('undo').addEventListener('click', undo);
  ['name1', 'name2'].forEach((id) => $(id).addEventListener('input', () => { save(); update(); }));

  let armTimer = null;
  function disarm() { clearTimeout(armTimer); const b = $('fullReset'); b.classList.remove('armed'); b.textContent = 'Volledig resetten'; }
  $('fullReset').addEventListener('click', () => {
    const b = $('fullReset');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Zeker weten? Klik nog een keer';
      clearTimeout(armTimer); armTimer = setTimeout(disarm, 4000); return;
    }
    disarm();
    scores = { 1: 0, 2: 0 };
    $('name1').value = 'Speler 1'; $('name2').value = 'Speler 2';
    try { localStorage.removeItem(KEY); } catch (e) {}
    starter = 1; newGame(1);
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key >= '1' && e.key <= '7') { play(+e.key - 1); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const d = e.key === 'ArrowLeft' ? -1 : 1;
      setHover(Math.max(0, Math.min(COLS - 1, (hoverCol < 0 ? 3 : hoverCol) + d)));
      e.preventDefault();
    }
    if ((e.key === 'Enter' || e.key === 'ArrowDown') && hoverCol >= 0 && document.activeElement?.parentElement !== colsEl && !e.target.closest('button')) {
      play(hoverCol); e.preventDefault();
    }
    if (e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey))) { undo(); e.preventDefault(); }
  });

  newGame(starter);
})();
</script>
</body>
</html>
