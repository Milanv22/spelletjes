<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galgje</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: één kolom op een lucht met wolken; dikke titel, dan per fase één cartoonkaart.
   Bewust één vaste, vrolijke look (geen donkere variant). */
:root {
  --sky-top: #7cc8ef;
  --sky-bottom: #c4ebfb;
  --cloud: #ffffff;
  --paper: #ffffff;
  --ink: #1f2a3c;
  --muted: #55667f;
  --soft: #e9f4fb;
  --yellow: #ffcc2e;
  --yellow-deep: #f2a900;
  --wood: #9a5a2c;
  --wood-dark: #5b3216;
  --rope: #e3b23c;
  --good: #1f9a5a;
  --good-soft: #d9f5e5;
  --bad: #e0443a;
  --bad-soft: #fde2df;
  --font-title: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--sky-top); }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%) fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 44px;
  position: relative;
  overflow-x: hidden;
}

/* Wolken op de achtergrond */
.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.cloud { position: absolute; fill: var(--cloud); opacity: .9; animation: drift linear infinite; }
.cloud.c1 { width: 130px; top: 9%; left: -10%; animation-duration: 70s; }
.cloud.c2 { width: 90px; top: 38%; left: -20%; animation-duration: 95s; animation-delay: -40s; opacity: .7; }
.cloud.c3 { width: 160px; top: 70%; left: -25%; animation-duration: 120s; animation-delay: -75s; opacity: .6; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(130vw); } }

.wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Titel */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font: 400 clamp(52px, 15vw, 84px)/0.95 var(--font-title);
  letter-spacing: .03em;
  color: var(--yellow);
  -webkit-text-stroke: 6px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  transform: rotate(-2deg);
}
.tally { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 10px; border-radius: 999px;
  background: var(--paper); border: 3px solid var(--ink);
  font: 600 14px/1 var(--font-ui);
  box-shadow: 0 3px 0 var(--ink);
}
.pill b { font: 400 20px/1 var(--font-title); font-variant-numeric: tabular-nums; }
.pill .dot { width: 10px; height: 10px; border-radius: 50%; }
.pill.won .dot { background: var(--good); }
.pill.lost .dot { background: var(--bad); }

/* Kaarten */
.card {
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 7px 0 var(--ink);
  padding-block: 22px;
  padding-inline: clamp(16px, 4.5vw, 28px);
  display: flex; flex-direction: column; gap: 16px;
}
h2 { margin: 0; font: 700 24px/1.15 var(--font-ui); text-wrap: balance; }
.muted { color: var(--muted); margin: 0; }

.field { display: flex; gap: 10px; flex-wrap: wrap; }
.input {
  flex: 1 1 220px; min-width: 0;
  font: 600 22px/1.2 var(--font-ui); letter-spacing: .08em;
  padding: 12px 16px; border-radius: 14px;
  border: 3px solid var(--ink); background: var(--soft); color: var(--ink);
}
.input::placeholder { color: var(--muted); letter-spacing: 0; font-weight: 500; }
.input:focus { outline: none; box-shadow: 0 0 0 4px var(--yellow); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; width: fit-content; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
.error { color: var(--bad); font-size: 14px; font-weight: 600; margin: 0; min-height: 1.4em; }

.btn {
  font: 700 17px/1 var(--font-ui);
  padding: 13px 20px; border-radius: 14px;
  border: 3px solid var(--ink);
  background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--yellow-deep); outline-offset: 2px; }
.btn.yellow { background: var(--yellow); }

.handover { align-items: center; text-align: center; padding-block: 34px; }
.handover .big { margin: 0; font: 400 32px/1.1 var(--font-title); letter-spacing: .02em; }
.handover .count { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.handover .count i { width: 22px; height: 5px; border-radius: 3px; background: var(--ink); }

/* Speelveld */
.top { display: grid; grid-template-columns: minmax(0, 230px) 1fr; gap: 20px; align-items: center; }
@media (max-width: 480px) { .top { grid-template-columns: 1fr; justify-items: center; } }
.stage { width: 100%; max-width: 230px; aspect-ratio: 240 / 260; background: var(--soft); border-radius: 16px; border: 3px solid var(--ink); overflow: hidden; }
.gallows { display: block; width: 100%; height: 100%; }
.gallows .part { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; transition: opacity .25s, transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.gallows .part.on { opacity: 1; transform: scale(1); }
.gallows .wood { fill: var(--wood); stroke: var(--wood-dark); stroke-width: 3; stroke-linejoin: round; }
.gallows .grain { stroke: var(--wood-dark); stroke-width: 1.5; opacity: .35; stroke-linecap: round; }
.gallows .rope { stroke: var(--rope); stroke-width: 6; stroke-linecap: round; fill: none; }
.gallows .knot { fill: var(--rope); stroke: var(--wood-dark); stroke-width: 2.5; }
.gallows .skin { fill: #fff; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.gallows .limb { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
.gallows .face { fill: var(--ink); }
.gallows .mouth { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.gallows .ground { fill: #7bc96f; }
.gallows .ground-edge { fill: #5daa52; }
.gallows .sad { display: none; }
.gallows.lost .sad { display: inline; }
.gallows.lost .happy { display: none; }
.gallows.lost { animation: shake .45s ease-in-out; }
@keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

.info { display: flex; flex-direction: column; gap: 14px; min-width: 0; width: 100%; }
.left { font: 400 24px/1.1 var(--font-title); letter-spacing: .02em; }
.meter { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.meter i { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); }
.meter i.used { background: var(--bad); }
.tried { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 6px; align-items: flex-start; min-height: 32px; }
.row .lbl { padding-top: 7px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); width: 40px; flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; flex: 1; }
.tag { font: 700 16px/1 var(--font-ui); padding: 6px 9px; border-radius: 8px; border: 2px solid currentColor; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.none { font-size: 14px; color: var(--muted); }

.word { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 26px; padding-block: 6px; min-height: 70px; align-items: flex-end; }
.slot {
  width: clamp(26px, 7.5vw, 42px); height: clamp(40px, 11vw, 58px);
  display: grid; place-items: end center;
  font: 400 clamp(28px, 8vw, 44px)/1 var(--font-title);
  color: var(--ink);
  border-bottom: 5px solid var(--ink); border-radius: 0 0 2px 2px;
  padding-bottom: 3px;
}
.slot.fill { animation: bounce .4s cubic-bezier(.3, 1.6, .5, 1); }
.slot.missed { color: var(--bad); }
.wordpart { display: inline-flex; gap: 9px; white-space: nowrap; }
.slot.sym { border-bottom-color: transparent; width: auto; }
@keyframes bounce { from { transform: translateY(-14px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

.keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 7px; }
@media (max-width: 440px) { .keys { grid-template-columns: repeat(7, 1fr); } }
.key {
  font: 400 21px/1 var(--font-title);
  padding: 10px 0 9px; border-radius: 11px;
  border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-width: 0;
  transition: transform .08s, box-shadow .08s;
}
.key:hover:not(:disabled) { background: var(--yellow); }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.key:focus-visible { outline: 4px solid var(--yellow-deep); outline-offset: 1px; }
.key:disabled { cursor: default; transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.key.good { background: var(--good); color: #fff; }
.key.bad { background: var(--bad); color: #fff; }

.whole { display: flex; gap: 10px; flex-wrap: wrap; }
.whole .input { font-size: 17px; letter-spacing: .02em; padding: 10px 14px; }

.result { margin: 0; text-align: center; font: 400 30px/1.15 var(--font-title); letter-spacing: .02em; text-wrap: balance; }
.result.win { color: var(--good); animation: bounce .5s cubic-bezier(.3, 1.6, .5, 1); }
.result.lose { color: var(--bad); }
.end { display: flex; justify-content: center; }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--ink); opacity: .75; font-size: 13px; margin: 0; max-width: 46ch; }
.link { all: unset; cursor: pointer; color: var(--ink); opacity: .75; font-size: 13px; text-decoration: underline; }
.link:focus-visible { outline: 3px solid var(--yellow-deep); }
.btn.small { font-size: 14px; padding: 9px 14px; box-shadow: 0 3px 0 var(--ink); }
.btn.danger.armed { background: var(--bad); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .cloud, .slot.fill, .result.win, .gallows.lost { animation: none !important; }
  .gallows .part { transition: none; }
}
.back {
  display: inline-flex; align-items: center; gap: 6px; width: fit-content;
  padding: 7px 14px 7px 10px; border-radius: 999px;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  color: var(--ink); text-decoration: none; font: 600 14px/1 var(--font-ui);
  transition: transform .08s, box-shadow .08s;
}
.back:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.back:focus-visible { outline: 4px solid var(--yellow-deep); outline-offset: 2px; }
.back svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <svg class="cloud c1" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
  <svg class="cloud c2" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
  <svg class="cloud c3" viewBox="0 0 120 60"><path d="M20 55a18 18 0 0 1 2-36 26 26 0 0 1 48-8 20 20 0 0 1 34 14 15 15 0 0 1-2 30z"/></svg>
</div>

<div class="wrap">
  <a class="back" href="./"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle spelletjes</a>
  <header>
    <h1>GALGJE</h1>
    <div class="tally" aria-label="Stand">
      <span class="pill won"><span class="dot"></span>Geraden <b id="tWon">0</b></span>
      <span class="pill lost"><span class="dot"></span>Niet geraden <b id="tLost">0</b></span>
    </div>
  </header>

  <!-- Woord invullen -->
  <section class="card" id="setup">
    <h2>Bedenk een geheim woord</h2>
    <p class="muted">Zorg dat de raders niet meekijken. Na het starten verdwijnt het woord van het scherm.</p>
    <div class="field" id="wordForm">
      <input class="input" id="secret" type="password" maxlength="30" placeholder="Typ hier het woord" aria-label="Geheim woord" autocomplete="new-password" data-lpignore="true" data-1p-ignore spellcheck="false">
      <button class="btn yellow" type="button" id="startBtn">Start</button>
    </div>
    <label class="check" id="peekLabel"><input type="checkbox" id="peek"> Toon wat ik typ</label>
    <p class="error" id="setupError" role="alert"></p>
  </section>

  <!-- Doorgeven -->
  <section class="card handover" id="handover" hidden>
    <p class="big">Raders, kom erbij!</p>
    <div class="count" id="count" aria-hidden="true"></div>
    <p class="muted" id="handoverSub"></p>
    <button class="btn yellow" type="button" id="ready">Begin met raden</button>
  </section>

  <!-- Raden -->
  <section class="card" id="play" hidden>
    <div class="top">
      <div class="stage">
        <svg class="gallows" id="gallows" viewBox="0 0 240 260" aria-hidden="true">
          <rect class="ground-edge" x="0" y="240" width="240" height="20"></rect>
          <path class="ground" d="M0 244 Q60 236 120 242 T240 240 V260 H0z"></path>
          <!-- 1 voet -->
          <g class="part"><rect class="wood" x="22" y="226" width="124" height="16" rx="3"></rect><rect class="wood" x="44" y="214" width="78" height="14" rx="3"></rect></g>
          <!-- 2 paal -->
          <g class="part"><rect class="wood" x="66" y="34" width="22" height="182" rx="3"></rect><line class="grain" x1="73" y1="60" x2="73" y2="120"></line><line class="grain" x1="81" y1="140" x2="81" y2="200"></line></g>
          <!-- 3 ligger -->
          <g class="part"><rect class="wood" x="60" y="24" width="138" height="20" rx="3"></rect><line class="grain" x1="100" y1="31" x2="150" y2="31"></line></g>
          <!-- 4 schoor -->
          <g class="part"><polygon class="wood" points="86,96 86,114 134,44 116,44"></polygon></g>
          <!-- 5 touw -->
          <g class="part"><line class="rope" x1="172" y1="44" x2="172" y2="70"></line><rect class="knot" x="164" y="66" width="16" height="18" rx="6"></rect></g>
          <!-- 6 hoofd -->
          <g class="part">
            <circle class="skin" cx="172" cy="106" r="24"></circle>
            <circle class="face" cx="164" cy="101" r="3.3"></circle>
            <circle class="face" cx="180" cy="101" r="3.3"></circle>
            <path class="mouth happy" d="M161 111 Q172 122 183 111"></path>
            <path class="mouth sad" d="M162 118 Q172 109 182 118"></path>
          </g>
          <!-- 7 lijf -->
          <g class="part"><path class="skin" d="M163 131 H181 L188 172 H156 Z"></path></g>
          <!-- 8, 9 armen -->
          <g class="part"><path class="limb" d="M161 140 L140 156 L132 152"></path></g>
          <g class="part"><path class="limb" d="M183 140 L204 156 L212 152"></path></g>
          <!-- 10, 11 benen -->
          <g class="part"><path class="limb" d="M165 172 L160 204 L150 206"></path></g>
          <g class="part"><path class="limb" d="M179 172 L184 204 L194 206"></path></g>
        </svg>
      </div>
      <div class="info">
        <div>
          <div class="left" id="left">Nog 11 fouten over</div>
          <div class="meter" id="meter" aria-hidden="true"></div>
        </div>
        <div class="tried">
          <div class="row"><span class="lbl">Goed</span><span class="tags" id="goodList"></span></div>
          <div class="row"><span class="lbl">Fout</span><span class="tags" id="badList"></span></div>
        </div>
      </div>
    </div>

    <div class="word" id="word" aria-live="polite"></div>
    <p class="result" id="result" role="status" hidden></p>

    <div class="keys" id="keys" aria-label="Letters"></div>

    <div class="whole" id="wholeForm">
      <input class="input" id="wholeGuess" placeholder="Weet je het hele woord?" aria-label="Raad het hele woord" spellcheck="false">
      <button class="btn" type="button" id="wholeBtn">Raad woord</button>
    </div>

    <div class="end" id="endBtns" hidden>
      <button class="btn yellow" type="button" id="next">Nieuw woord</button>
    </div>
  </section>

  <div class="foot">
    <p class="hint">Je kunt ook letters typen op je toetsenbord. Een fout geraden woord telt als één fout.</p>
    <button class="btn small danger" id="fullReset" type="button">Volledig resetten</button>
  </div>
</div>

<script>
(function () {
  const MAX = 11;
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const $ = (id) => document.getElementById(id);
  const parts = [...document.querySelectorAll('#gallows .part')];

  let word = '', norm = '';
  let guessed = new Set();
  let wrong = [];
  let phase = 'setup';
  let finished = false;
  let tally = { won: 0, lost: 0 };

  try {
    const s = JSON.parse(localStorage.getItem('galgje-team') || 'null');
    if (s) tally = { won: +s.won || 0, lost: +s.lost || 0 };
  } catch (e) {}
  function save() { try { localStorage.setItem('galgje-team', JSON.stringify(tally)); } catch (e) {} }
  function renderTally() { $('tWon').textContent = tally.won; $('tLost').textContent = tally.lost; }

  const plain = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const isLetter = (ch) => /[A-Z]/.test(ch);
  const letterCount = () => [...norm].filter(isLetter).length;
  const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  ALPHA.forEach((L) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'key'; b.id = 'key' + L; b.textContent = L;
    b.setAttribute('aria-label', 'Letter ' + L);
    b.addEventListener('click', () => guessLetter(L));
    $('keys').appendChild(b);
  });
  for (let i = 0; i < MAX; i++) $('meter').appendChild(document.createElement('i'));

  function show(p) {
    phase = p;
    $('setup').hidden = p !== 'setup';
    $('handover').hidden = p !== 'handover';
    $('play').hidden = p !== 'play';
    renderTally();
  }

  // Woord invullen
  // 'Toon wat ik typ' werkt alleen tijdens het invullen; na Start is het woord nergens meer op te vragen
  let locked = false;
  function lockSecret() {
    locked = true;
    $('secret').value = '';
    $('secret').type = 'password';
    $('peek').checked = false;
    $('peek').disabled = true;
  }
  function unlockSecret() {
    locked = false;
    $('secret').value = '';
    $('secret').type = 'password';
    $('peek').checked = false;
    $('peek').disabled = false;
  }
  $('peek').addEventListener('change', (e) => {
    if (locked || phase !== 'setup') { e.target.checked = false; $('secret').type = 'password'; return; }
    $('secret').type = e.target.checked ? 'text' : 'password';
  });
  $('secret').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startWord(); } });
  $('startBtn').addEventListener('click', startWord);
  function startWord() {
    const raw = $('secret').value.trim().replace(/\s+/g, ' ');
    const n = plain(raw);
    if (!raw) return setError('Vul eerst een woord in.');
    if (!/^[A-Z][A-Z '\-]*$/.test(n)) return setError('Gebruik alleen letters. Spaties en streepjes mogen ook.');
    if ([...n].filter(isLetter).length < 2) return setError('Kies een woord van minstens twee letters.');
    setError('');
    word = raw; norm = n;
    lockSecret();
    $('handoverSub').textContent = `Het woord heeft ${letterCount()} letters.`;
    $('count').innerHTML = [...norm].map((ch) => (isLetter(ch) ? '<i></i>' : '<span style="width:10px"></span>')).join('');
    show('handover');
    $('ready').focus();
  }
  function setError(t) { $('setupError').textContent = t; }

  $('ready').addEventListener('click', startRound);

  // Raden
  function startRound() {
    guessed = new Set(); wrong = []; finished = false;
    $('gallows').classList.remove('lost');
    ALPHA.forEach((L) => { const k = $('key' + L); k.className = 'key'; k.disabled = false; });
    $('result').hidden = true; $('result').className = 'result';
    $('endBtns').hidden = true;
    $('wholeForm').hidden = false; $('keys').hidden = false;
    $('wholeGuess').value = '';
    renderWord();
    renderStatus();
    show('play');
  }

  function renderWord(reveal, justNow) {
    const w = $('word');
    w.innerHTML = '';
    let part = null;
    [...word].forEach((orig, i) => {
      const n = norm[i];
      if (n === ' ') { part = null; return; }
      if (!part) { part = document.createElement('span'); part.className = 'wordpart'; w.appendChild(part); }
      const s = document.createElement('span');
      if (!isLetter(n)) { s.className = 'slot sym'; s.textContent = orig; }
      else {
        s.className = 'slot';
        if (guessed.has(n)) { s.textContent = orig.toUpperCase(); if (n === justNow) s.classList.add('fill'); }
        else if (reveal) { s.textContent = orig.toUpperCase(); s.classList.add('missed'); }
      }
      part.appendChild(s);
    });
    w.setAttribute('aria-label', `Woord van ${letterCount()} letters`);
  }

  function renderStatus() {
    const left = MAX - wrong.length;
    $('left').textContent = finished
      ? (left > 0 ? `${wrong.length} fout${wrong.length === 1 ? '' : 'en'} gemaakt` : 'De tekening is af')
      : `Nog ${left} fout${left === 1 ? '' : 'en'} over`;
    [...$('meter').children].forEach((m, i) => m.classList.toggle('used', i < wrong.length));
    parts.forEach((p, i) => p.classList.toggle('on', i < wrong.length));
    const good = [...guessed].filter((L) => norm.includes(L)).sort();
    $('goodList').innerHTML = good.length ? good.map((L) => `<span class="tag good">${L}</span>`).join('') : '<span class="none">nog geen</span>';
    $('badList').innerHTML = wrong.length ? wrong.map((g) => `<span class="tag bad">${esc(g)}</span>`).join('') : '<span class="none">nog geen</span>';
  }

  function guessLetter(L) {
    if (phase !== 'play' || finished || guessed.has(L)) return;
    guessed.add(L);
    const k = $('key' + L);
    k.disabled = true;
    if (norm.includes(L)) { k.classList.add('good'); renderWord(false, L); }
    else { k.classList.add('bad'); wrong.push(L); }
    checkEnd();
    renderStatus();
  }

  $('wholeGuess').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); guessWhole(); } });
  $('wholeBtn').addEventListener('click', guessWhole);
  function guessWhole() {
    if (finished) return;
    const g = plain($('wholeGuess').value.trim().replace(/\s+/g, ' '));
    if (!g) return;
    $('wholeGuess').value = '';
    if (g === norm) {
      [...norm].filter(isLetter).forEach((L) => guessed.add(L));
      renderWord(false);
      finish(true);
    } else {
      wrong.push(g.length > 12 ? g.slice(0, 12) + '…' : g);
      checkEnd();
    }
    renderStatus();
  }

  function checkEnd() {
    if ([...norm].filter(isLetter).every((L) => guessed.has(L))) finish(true);
    else if (wrong.length >= MAX) finish(false);
  }

  function finish(won) {
    finished = true;
    tally[won ? 'won' : 'lost']++;
    save(); renderTally();
    ALPHA.forEach((L) => { $('key' + L).disabled = true; });
    $('keys').hidden = true; $('wholeForm').hidden = true;
    if (!won) { $('gallows').classList.add('lost'); renderWord(true); }
    const r = $('result');
    r.hidden = false;
    r.className = 'result ' + (won ? 'win' : 'lose');
    r.textContent = won ? 'Geraden! Goed gedaan.' : `Helaas, het woord was ${word.toUpperCase()}.`;
    $('endBtns').hidden = false;
    $('next').focus();
  }

  $('next').addEventListener('click', () => {
    word = ''; norm = '';
    unlockSecret();
    show('setup');
    $('secret').focus();
  });

  document.addEventListener('keydown', (e) => {
    if (phase !== 'play' || finished) return;
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
    const L = plain(e.key);
    if (L.length === 1 && isLetter(L)) { e.preventDefault(); guessLetter(L); }
  });

  // Volledig resetten: eerst klikken om te bevestigen, dan nog eens
  let armTimer = null;
  $('fullReset').addEventListener('click', () => {
    const b = $('fullReset');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = 'Zeker weten? Klik nog een keer';
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    tally = { won: 0, lost: 0 };
    try { localStorage.removeItem('galgje-team'); } catch (e) {}
    word = ''; norm = ''; guessed = new Set(); wrong = []; finished = false;
    $('setupError').textContent = '';
    unlockSecret();
    show('setup');
    $('secret').focus();
  });
  function disarm() {
    clearTimeout(armTimer);
    const b = $('fullReset');
    b.classList.remove('armed');
    b.textContent = 'Volledig resetten';
  }

  show('setup');
})();

</script>
</body>
</html>
